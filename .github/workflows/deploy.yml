name: テスト・ビルド・公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest は 2026年10月19日から Ubuntu 26 に移る。Playwright のブラウザと依存（--with-deps）が
    # 新しい版に対応するまで、今の版に留める（対応を確かめてから上げる）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # 取り出したあとの手順に、リポジトリの鍵（GITHUB_TOKEN）を残さない
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: 型の検査
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Playwright のブラウザを入れる
        run: npx playwright install --with-deps chromium

      - name: Playwright（390×844）
        run: npm run e2e

      - name: e2e の結果を残す
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: ビルド
        run: npm run build

      - name: 公開用のビルドを確かめる（テスト用の窓口がなく、CSP が入っている）
        run: |
          if grep -q "__aero" dist/assets/*.js; then echo "テスト用の窓口（__aero）が公開用のビルドに入っている"; exit 1; fi
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v5
